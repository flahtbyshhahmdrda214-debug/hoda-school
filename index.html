<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/hoda-3d-logo-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مجتمع آموزشی قرآنی هدی | وب‌سایت رسمی و معرفی مدارس چهارگانه</title>
    <!-- Official Persian/Arabic Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/estedad/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/css/peyda.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/css/dana.css">
    <script>
      (function() {
        try {
          var savedFont = localStorage.getItem('hoda_site_font');
          if (!savedFont) {
            var rawSettings = localStorage.getItem('hoda_settings_db');
            if (rawSettings) {
              var settings = JSON.parse(rawSettings);
              savedFont = settings.site_font || (settings.typography && settings.typography.fontFamily);
            }
          }
          if (savedFont) {
            document.documentElement.setAttribute('data-font', savedFont);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-vazir bg-slate-50 text-slate-900 antialiased selection:bg-turquoise-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
